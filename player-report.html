<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Report - PPM Assistant</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from './chunk.js';
      import { createPinia } from './chunk.js';
      import PlayerReport from './playerReport.js';

      const app = createApp(PlayerReport);
      const pinia = createPinia();
      app.use(pinia);
      app.mount("#app");
    </script>
  </body>
</html>
